<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>像素画生成器 · Pixel Art Generator</title>
<meta name="description" content="上传图片一键转像素画：10 种风格调色板（复古掌机 / 街机 16 色 / CGA / 霓虹赛博 / 拼豆色卡…）、亮度对比度、Floyd-Steinberg 抖动，全部在浏览器本地完成，不上传。" />
<style>
  :root{
    --bg:#0b0d11; --panel:#141821; --panel2:#1b2029; --line:#252b36;
    --text:#e8eaee; --muted:#9aa3ae; --primary:#5b93f5; --accent:#a78bfa;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  header h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
    background:rgba(91,147,245,.14);color:var(--primary);font-size:12px;vertical-align:middle}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-top:18px}
  .panel h2{margin:0 0 12px;font-size:16px}
  .stats{color:var(--muted);font-size:13px;margin-left:8px;font-weight:400}

  /* 上传区 */
  .drop{border:2px dashed var(--line);border-radius:var(--radius);padding:48px 20px;text-align:center;
    cursor:pointer;transition:border-color .2s,background .2s}
  .drop:hover,.drop.on{border-color:var(--primary);background:rgba(91,147,245,.06)}
  .drop svg{color:var(--muted)}
  .drop-title{margin:10px 0 4px;font-size:16px}
  .drop-sub{margin:0;color:var(--muted);font-size:13px}

  /* 风格卡 */
  .styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .style{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;
    text-align:left;cursor:pointer;color:var(--text);transition:border-color .15s,transform .15s}
  .style:hover{border-color:var(--accent);transform:translateY(-2px)}
  .style.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
  .style .sw{display:flex;gap:3px;margin-bottom:6px}
  .style .sw i{width:14px;height:14px;border-radius:3px;display:block}
  .style .nm{font-size:14px;font-weight:600}
  .style .nt{font-size:12px;color:var(--muted)}

  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
  .field label{display:block;font-size:13px;margin-bottom:6px}
  .field label b{color:var(--primary)}
  .field .hint{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  input[type=range]{width:100%;accent-color:var(--primary)}
  select,button{font:inherit}
  select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 6px;cursor:pointer;font-size:13px}
  .seg button.on{background:rgba(91,147,245,.18);border-color:var(--primary);color:var(--primary)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .presets button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
  .presets button.on{border-color:var(--primary);color:var(--primary)}

  /* 预览 */
  .preview{background:
      repeating-conic-gradient(#2a2f38 0% 25%, #232830 0% 50%) 0 0/16px 16px;
    border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:center}
  canvas{max-width:100%;image-rendering:pixelated;background:#000}
  .used{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
  .used i{width:14px;height:14px;border-radius:3px;display:block}
  .actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .btn{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:0;
    border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .tip{color:var(--muted);font-size:12px;margin-top:10px}
  footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
  footer a{color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>像素画生成器<span class="badge">纯本地 · 不上传</span></h1>
    <p>上传一张图片，一键转成像素画 / 马赛克装饰画：10 种风格调色板、亮度对比度、抖动算法，导出高清 PNG。</p>
  </header>

  <div id="drop" class="drop">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-4.5-4.5L7 20"/>
    </svg>
    <p class="drop-title">点击选择图片，或拖拽 / 粘贴（Ctrl+V）到此处</p>
    <p class="drop-sub">支持 JPG / PNG / WebP — 图片只在你的浏览器里处理，不会传到任何服务器</p>
    <input id="file" type="file" accept="image/*" hidden />
  </div>

  <div id="work" hidden>
    <section class="panel">
      <h2>转换风格<span class="stats">不同调色板出来的感觉完全不同，点一个试试</span></h2>
      <div id="styles" class="styles"></div>

      <div class="row">
        <div class="field">
          <label>像素块数（横向）：<b id="gwVal">64</b></label>
          <input id="gw" type="range" min="16" max="512" step="4" value="64" />
          <div class="presets" id="gwPresets"></div>
        </div>
        <div class="field" id="fColors">
          <label>颜色数量</label>
          <select id="colors">
            <option value="8">8 色（极简）</option>
            <option value="16" selected>16 色（推荐）</option>
            <option value="32">32 色</option>
            <option value="64">64 色</option>
            <option value="128">128 色</option>
            <option value="256">256 色</option>
            <option value="512">512 色（几乎还原）</option>
          </select>
          <span class="hint">块数和颜色越多越接近原图，生成也稍慢</span>
        </div>
        <div class="field">
          <label>亮度：<b id="brVal">0</b></label>
          <input id="br" type="range" min="-60" max="60" step="5" value="0" />
        </div>
        <div class="field">
          <label>对比度：<b id="ctVal">0</b></label>
          <input id="ct" type="range" min="-50" max="50" step="5" value="0" />
        </div>
        <div class="field">
          <label>抖动算法</label>
          <div class="seg">
            <button data-d="none" class="on">关闭</button>
            <button data-d="fs">Floyd–Steinberg</button>
          </div>
          <span class="hint">照片 / 渐变图开启后过渡更自然</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>预览与导出<span class="stats" id="stat"></span></h2>
      <div class="preview"><canvas id="out"></canvas></div>
      <div class="used" id="used"></div>
      <div class="actions">
        <div class="field" style="min-width:200px">
          <label>导出尺寸（每格边长）</label>
          <select id="cell">
            <option value="1">1×（原图大小）</option>
            <option value="4">4×</option>
            <option value="8" selected>8×（推荐）</option>
            <option value="12">12×</option>
            <option value="16">16×（挂画打印）</option>
          </select>
        </div>
        <button class="btn" id="dl">下载 PNG</button>
        <button class="btn ghost" id="reset">换一张图</button>
      </div>
      <p class="tip">8× 以上导出后边缘才是干净的方块，适合打印或做拼豆参考图。</p>
    </section>
  </div>

  <footer>单文件 · 零依赖 · 离线可用 — <a href="README.zh-CN.md">中文说明</a> · <a href="README.md">English</a></footer>
</div>

  { id:'classic', name:'经典像素',   note:'原图自动减色',      type:'auto',    preview:['#e85d4a','#f2b134','#4ea24e','#3f6fc4','#8a5fc0','#3a3f4a'] },
  { id:'gameboy', name:'复古掌机',   note:'四色墨绿屏',        type:'palette', palette:GB, preview:GB },
  { id:'pico8',   name:'街机 16 色', note:'幻想主机配色',      type:'palette', palette:PICO8, preview:PICO8.slice(8) },
  { id:'cga',     name:'老电脑 CGA', note:'1981 年 16 色',     type:'palette', palette:CGA, preview:CGA.slice(8) },
  { id:'mono',    name:'黑白报纸',   note:'灰阶高对比',        type:'gray',    preview:['#111111','#4a4a4a','#8a8a8a','#d4d4d4','#ffffff'] },
  { id:'bead',    name:'拼豆色卡',   note:'MARD 291 色匹配',   type:'palette', palette:MARD_PALETTE, preview:['#f01820','#ecd800','#56ba9f','#3370c0','#604089','#f1f1f1'] },
  { id:'bead-xl', name:'拼豆全色卡', note:'优肯 415 色大色域', type:'palette', palette:ARTKAL_PALETTE, preview:['#fa5a50','#f9d54a','#4fb06d','#2f6fc1','#9a4fc4','#f5f0e6'] },
  { id:'neon',    name:'霓虹赛博',   note:'高饱和夜色',        type:'palette', palette:NEON, preview:NEON.slice(2,10) },
  { id:'sunset',  name:'落日暖调',   note:'橙红金渐变',        type:'palette', palette:SUNSET, preview:SUNSET.slice(2,8) },
  { id:'ice',     name:'冰川冷调',   note:'青蓝克制系',        type:'palette', palette:ICE, preview:ICE.slice(2,8) }
];

/* ===================== 状态 ===================== */
const $ = (id) => document.getElementById(id);
let img = null, styleId = 'classic', dither = 'none', timer = 0, objUrl = '';
let lastPalette = [];

/* ===================== 工具函数 ===================== */
function clamp(v){ return v < 0 ? 0 : v > 255 ? 255 : v | 0 }
function hexToRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)] }
function rgbKey(p){ return '#' + p.map(v => v.toString(16).padStart(2,'0')).join('') }
/** 加权欧氏距离（redmean），比裸 RGB 距离更贴近人眼 */
function colorDistance(r1,g1,b1,r2,g2,b2){
  const rm = (r1 + r2) / 2;
  const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return Math.sqrt((2 + rm/256) * dr*dr + 4 * dg*dg + (2 + (255-rm)/256) * db*db);
}

/** 自动减色：4bit/通道直方图 → 取前 K 桶的均值色 */
function autoPalette(data, k){
  const sums = new Map();
  for (let i = 0; i < data.length; i += 4){
    if (data[i+3] < 128) continue;
    const key = ((data[i] >> 4) << 8) | ((data[i+1] >> 4) << 4) | (data[i+2] >> 4);
    const b = sums.get(key) || [0,0,0,0];
    b[0] += data[i]; b[1] += data[i+1]; b[2] += data[i+2]; b[3]++;
    sums.set(key, b);
  }
  return [...sums.values()].sort((a,b) => b[3]-a[3]).slice(0,k)
    .map(b => [Math.round(b[0]/b[3]), Math.round(b[1]/b[3]), Math.round(b[2]/b[3])]);
}
function grayPalette(k){
  const out = [];
  for (let i = 0; i < k; i++){ const v = Math.round(i * 255 / (k - 1)); out.push([v,v,v]) }
  return out;
}
/** 最近色 + 精确 RGB 缓存（大调色板时命中率可观） */
function nearest(palette, r, g, b, cache){
  const key = (r << 16) | (g << 8) | b;
  const hit = cache.get(key);
  if (hit) return hit;
  let best = palette[0], bestD = Infinity;
  for (let i = 0; i < palette.length; i++){
    const p = palette[i];
    const d = colorDistance(r,g,b,p[0],p[1],p[2]);
    if (d < bestD){ bestD = d; best = p }
  }
  cache.set(key, best);
  return best;
}
function spread(err, w, h, x, y, er, eg, eb, f){
  if (x < 0 || x >= w || y >= h) return;
  const i = (y * w + x) * 4;
  err[i] += er * f; err[i+1] += eg * f; err[i+2] += eb * f;
}

/* ===================== 主流程 ===================== */
function activeStyle(){ return STYLES.find(s => s.id === styleId) }
function gridH(){ return img ? Math.max(1, Math.round((+$('gw').value * img.height) / img.width)) : 0 }

function generate(){
  const out = $('out');
  if (!img) return;
  const w = +$('gw').value, h = gridH();
  out.width = w; out.height = h;

  // ① 缩到目标格数（浏览器双三次插值天然起到平均/抗锯齿作用）
  const work = document.createElement('canvas');
  work.width = w; work.height = h;
  const wctx = work.getContext('2d', { willReadFrequently: true });
  wctx.drawImage(img, 0, 0, w, h);
  const idata = wctx.getImageData(0, 0, w, h);
  const data = idata.data;

  // ② 亮度 / 对比度
  const br = +$('br').value, ct = +$('ct').value;
  const cf = (259 * (ct + 255)) / (255 * (259 - ct));
  for (let i = 0; i < data.length; i += 4){
    data[i]   = clamp(cf * (clamp(data[i]   + br) - 128) + 128);
    data[i+1] = clamp(cf * (clamp(data[i+1] + br) - 128) + 128);
    data[i+2] = clamp(cf * (clamp(data[i+2] + br) - 128) + 128);
  }

  // ③ 调色板
  const st = activeStyle();
  let palette;
  if (st.type === 'auto') palette = autoPalette(data, +$('colors').value);
  else if (st.type === 'gray') palette = grayPalette(+$('colors').value);
  else palette = st.palette.map(hexToRgb);
  lastPalette = palette;

  // ④ 映射（可选 Floyd–Steinberg 抖动）
  const cache = new Map(), used = new Set();
  if (dither === 'fs'){
    const err = new Float32Array(data.length);
    for (let i = 0; i < data.length; i++) err[i] = data[i];
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const i = (y * w + x) * 4;
        const r = clamp(err[i]), g = clamp(err[i+1]), b = clamp(err[i+2]);
        const p = nearest(palette, r, g, b, cache);
        data[i] = p[0]; data[i+1] = p[1]; data[i+2] = p[2];
        used.add(rgbKey(p));
        const er = r - p[0], eg = g - p[1], eb = b - p[2];
        spread(err, w, h, x+1, y,   er, eg, eb, 7/16);
        spread(err, w, h, x-1, y+1, er, eg, eb, 3/16);
        spread(err, w, h, x,   y+1, er, eg, eb, 5/16);
        spread(err, w, h, x+1, y+1, er, eg, eb, 1/16);
      }
    }
  } else {
    for (let i = 0; i < data.length; i += 4){
      if (data[i+3] < 128) continue;
      const p = nearest(palette, data[i], data[i+1], data[i+2], cache);
      data[i] = p[0]; data[i+1] = p[1]; data[i+2] = p[2];
      used.add(rgbKey(p));
    }
  }
  wctx.putImageData(idata, 0, 0);
  out.getContext('2d').putImageData(idata, 0, 0);

  // ⑤ 统计
  const list = [...used].sort();
  $('used').innerHTML = list.slice(0, 120).map(c => `<i style="background:${c}" title="${c}"></i>`).join('');
  $('stat').textContent = `${w} × ${h} 像素 · 用了 ${list.length} 种颜色`;
}
function schedule(){ clearTimeout(timer); timer = setTimeout(generate, 80) }

/* ===================== 交互 ===================== */
function loadFile(f){
  if (!f || !f.type.startsWith('image/')) return;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { img = im; $('drop').hidden = true; $('work').hidden = false; generate() };
  im.src = objUrl;
}
$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = '' });
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('on') });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('on'));
$('drop').addEventListener('drop', (e) => {
  e.preventDefault(); $('drop').classList.remove('on'); loadFile(e.dataTransfer.files[0]);
});
document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) if (it.type.startsWith('image/')) { loadFile(it.getAsFile()); break }
});

// 风格卡
$('styles').innerHTML = STYLES.map(s => `
  <button class="style${s.id === styleId ? ' on' : ''}" data-id="${s.id}">
    <span class="sw">${s.preview.map(c => `<i style="background:${c}"></i>`).join('')}</span>
    <span class="nm">${s.name}</span><br><span class="nt">${s.note}</span>
  </button>`).join('');
$('styles').addEventListener('click', (e) => {
  const b = e.target.closest('.style'); if (!b) return;
  styleId = b.dataset.id;
  [...$('styles').children].forEach(x => x.classList.toggle('on', x === b));
  const t = activeStyle().type;
  $('fColors').hidden = !(t === 'auto' || t === 'gray');
  generate();
});

// 预设
const PRESETS = [[32,'头像 32'],[64,'标准 64'],[128,'精细 128'],[256,'挂画 256'],[512,'极致 512']];
$('gwPresets').innerHTML = PRESETS.map(([v,n]) => `<button data-v="${v}">${n}</button>`).join('');
$('gwPresets').addEventListener('click', (e) => {
  if (!e.target.dataset.v) return;
  $('gw').value = e.target.dataset.v; syncLabels(); schedule();
});
['gw','br','ct'].forEach(id => $(id).addEventListener('input', () => { syncLabels(); schedule() }));
$('colors').addEventListener('change', generate);
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  dither = b.dataset.d;
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  generate();
}));
function syncLabels(){
  $('gwVal').textContent = $('gw').value;
  $('brVal').textContent = (+$('br').value > 0 ? '+' : '') + $('br').value;
  $('ctVal').textContent = (+$('ct').value > 0 ? '+' : '') + $('ct').value;
}

$('dl').addEventListener('click', () => {
  const out = $('out'), scale = document.createElement('canvas'), cell = +$('cell').value;
  scale.width = out.width * cell; scale.height = out.height * cell;
  const sctx = scale.getContext('2d');
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(out, 0, 0, scale.width, scale.height);
  scale.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pixel-art-${styleId}-${out.width}x${out.height}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
});
$('reset').addEventListener('click', () => {
  img = null; $('work').hidden = true; $('drop').hidden = false; $('used').innerHTML = '';
});
</script>
</body>
</html>
